<!DOCTYPE html>
<html>
<head>
    <title>Login - CineMind AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🎬 CineMind AI</h1>

        <h2>Welcome Back</h2>

        <p>Login to continue</p>

        <form action="/login" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
